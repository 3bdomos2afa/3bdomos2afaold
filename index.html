<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdelrahman | Portfolio</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
background:linear-gradient(135deg,#000,#0f172a);
}

h1{
font-size:60px;
background:linear-gradient(to right,#2563eb,#1e40af);
-webkit-background-clip:text;
color:transparent;
animation:fade 1.5s ease forwards;
}

p{
color:#aaa;
font-size:20px;
animation:fade 2s ease forwards;
}

button{
margin-top:30px;
padding:15px 30px;
background:#2563eb;
border:none;
color:#fff;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1e40af;
transform:scale(1.05);
}

.section{
padding:100px 20px;
text-align:center;
}

.card{
background:#0f172a;
padding:30px;
margin:20px auto;
max-width:400px;
border-radius:12px;
transition:0.4s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 20px #2563eb;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="hero">
<h1>Abdelrahman</h1>
<p>Frontend Developer | Creative Web Experiences</p>
<button onclick="scrollToSection()">View Projects</button>
</div>

<div class="section" id="projects">
<h2>Projects</h2>

<div class="card">
<h3>AI Tools Directory</h3>
<p>Advanced UI platform for discovering AI tools.</p>
</div>

<div class="card">
<h3>Prayer Times Web App</h3>
<p>Modern Islamic web application with clean design.</p>
</div>

</div>

<script>
function scrollToSection(){
document.getElementById("projects").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
